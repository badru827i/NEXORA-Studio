name: NEXORA Studio QA Bot
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexora-studio-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-qa:
    name: Build, test and validate APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 emulator system-images;android-34;google_apis;x86_64'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile, run checks and lint
        run: gradle --no-daemon clean assembleDebug testDebugUnitTest verifyTimelineMath lintDebug
      - name: Run Android Emulator UI smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: gradle --no-daemon connectedDebugAndroidTest
      - name: Validate generated APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          echo "APK_SIZE=$(du -h "$APK" | cut -f1)" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "APK validation passed."
      - name: Publish QA report
        if: always()
        shell: bash
        run: |
          {
            echo "## NEXORA Studio QA Bot"
            echo ""
            echo "- Commit: \`\${GITHUB_SHA::12}\`"
            echo "- Workflow result: **\${{ job.status }}**"
            if [ -n "\${APK_SIZE:-}" ]; then
              echo "- APK size: **$APK_SIZE**"
              echo "- SHA-256: \`$APK_SHA256\`"
              echo "- APK archive integrity: **PASS**"
            echo "- Android Emulator instrumentation test: **PASS**"
            else
              echo "- APK validation: **NOT COMPLETED**"
              echo "- Emulator test: see job logs for result"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-studio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
